<!doctype html>
<html lang="en" class="no-js">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<script>
			(() => {
				const STATE_KEY = 'quote-slicer-docs:theme-state:v3';
				const LEGACY_STATE_KEY = 'quote-slicer-docs:theme-state:v2';

				const root = document.documentElement;
				root.classList.replace('no-js', 'js');

				const osTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
					? 'dark'
					: 'light';

				const applyTheme = (theme) => {
					root.classList.toggle('dark', theme === 'dark');
					root.style.colorScheme = theme;
				};

				// ponytail: mirrors resolveTheme() in themeState.ts. The prepaint script
				// runs before hydration and can't import, so the "last change wins,
				// OS-drift-aware" rule is duplicated here. Keep the two in sync.
				const parseState = (value) => {
					try {
						const stored = JSON.parse(value || 'null');
						if (
							stored &&
							stored.version === 2 &&
							(stored.mode === 'dark' || stored.mode === 'light') &&
							(stored.osAtPick === 'dark' || stored.osAtPick === 'light')
						) {
							return { theme: stored.mode, osThemeAtPick: stored.osAtPick };
						}
						if (
							stored &&
							stored.version === 3 &&
							(stored.theme === 'dark' || stored.theme === 'light') &&
							(stored.osThemeAtPick === 'dark' || stored.osThemeAtPick === 'light')
						) {
							return stored;
						}
					} catch {
						return null;
					}
					return null;
				};

				try {
					const stored =
						parseState(localStorage.getItem(STATE_KEY)) ||
						parseState(localStorage.getItem(LEGACY_STATE_KEY));

					applyTheme(stored && stored.osThemeAtPick === osTheme ? stored.theme : osTheme);
				} catch {
					applyTheme(osTheme);
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
